<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dado online</title>
<style>
:root{--bg:#e9eeea;--ink:#1d2a26;--die:#fbfaf4;--pip:#1d2a26;--btn:#1d2a26;--btnt:#fbfaf4;--mut:#5d6d67;--chip:#d3dcd6;--line:#c4cfc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201c;--ink:#e8efe9;--die:#f1efe4;--pip:#14201c;--btn:#e8efe9;--btnt:#14201c;--mut:#93a49c;--chip:#25362f;--line:#2f443b}}
:root[data-theme="dark"]{--bg:#14201c;--ink:#e8efe9;--die:#f1efe4;--pip:#14201c;--btn:#e8efe9;--btnt:#14201c;--mut:#93a49c;--chip:#25362f;--line:#2f443b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;gap:12px;touch-action:manipulation}
section,#sides,#feedwrap{width:100%;max-width:520px}
#lobby{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
input{border:2px solid var(--line);background:var(--die);color:var(--pip);font:inherit;border-radius:12px;height:44px;padding:0 12px;min-width:0}
#nick{flex:1 1 140px}#code{flex:1 1 140px}
.chip{height:40px;min-width:54px;padding:0 12px;border-radius:12px;background:var(--chip);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnt)}
#lobby button{height:44px;padding:0 16px;font-weight:600}
#lobby .sec{background:var(--chip);color:var(--ink)}
#status{color:var(--mut);font-size:.9rem;min-height:1.2em;text-align:center}
#peers{color:var(--mut);font-size:.95rem;text-align:center;overflow-wrap:anywhere}
#sides{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#cust{display:none;gap:8px;align-items:center}
#cust.on{display:flex}
#cin{width:130px}
#who{color:var(--mut);min-height:1.4em;font-size:1rem}
#total{font-size:2.4rem;font-weight:700;min-height:3rem}
#tray{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;align-content:center;width:100%;max-width:520px;min-height:200px;cursor:pointer;--s:88px}
.die{width:var(--s);height:var(--s);background:var(--die);border-radius:18px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*.14);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.die.x{display:flex;align-items:center;justify-content:center;box-shadow:none;padding:0;border-radius:0;color:var(--pip);font-weight:700}
.die.s4{clip-path:polygon(50% 4%,98% 92%,2% 92%);align-items:flex-end;padding-bottom:calc(var(--s)*.2)}
.die.s8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.die.s10{clip-path:polygon(50% 0,96% 38%,80% 100%,20% 100%,4% 38%)}
.die.s12{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.die.s20{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die.s100,.die.sc{border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.die.go{animation:sh .18s linear infinite}
@keyframes sh{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}100%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.die.go{animation:none}}
.pip{width:calc(var(--s)*.17);height:calc(var(--s)*.17);border-radius:50%;background:var(--pip);place-self:center}
.bar{display:flex;gap:14px;align-items:center}
button{font:inherit;border:0;border-radius:14px;background:var(--btn);color:var(--btnt);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mut);outline-offset:3px}
.step{width:52px;height:52px;font-size:1.6rem}
#roll{height:60px;padding:0 56px;font-size:1.3rem;font-weight:700}
#n{min-width:2ch;text-align:center;font-size:1.3rem;font-weight:600}
.mod{gap:10px}.mod span{color:var(--mut);font-size:.95rem}
#min{width:96px;height:52px;border-radius:14px;font-size:1.2rem;text-align:center}
#feedwrap h2{margin:14px 0 6px;font-size:1.1rem}
#list{list-style:none;margin:0;padding:0}
#list li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
#list .t{color:var(--mut);font-size:.85rem;white-space:nowrap;align-self:center}
#list .r{overflow-wrap:anywhere}
#empty{color:var(--mut);padding:14px 2px}
#npcs{width:100%;max-width:520px;color:var(--mut)}
#npcs summary{cursor:pointer;padding:6px 0;text-align:center}
.npcrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.npcrow label{font-size:.95rem}
#npcn{flex:1 1 160px;max-width:240px}
select{border:2px solid var(--line);background:var(--die);color:var(--pip);font:inherit;border-radius:12px;height:44px;padding:0 10px;max-width:220px}
select:focus-visible{outline:3px solid var(--mut);outline-offset:3px}
#music{width:100%;max-width:520px;color:var(--mut)}
#music summary{cursor:pointer;padding:6px 0;text-align:center}
#murl{flex:1 1 240px}
#mplayer{width:100%;max-width:520px}
#mplayer .ml{color:var(--mut);font-size:.95rem;margin:6px 0}
#mplayer iframe{width:100%;border:0;border-radius:12px;display:block}
#mplayer iframe.yt{aspect-ratio:16/9}
#mplayer audio{width:100%}
#mplayer a{display:inline-block;margin-top:8px;color:var(--mut);font-size:.9rem}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
#feedwrap .hrow h2{margin:0}
#fichas{width:100%;max-width:520px;color:var(--mut)}
#fichas summary{cursor:pointer;padding:6px 0;text-align:center}
.fi{flex:1 1 150px;min-width:0}.fi.sm{flex:1 1 80px}
.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.arow{display:flex;gap:6px}.arow input{min-width:0;width:50%;padding:0 8px}
#fichas textarea{width:100%;min-height:90px;margin-top:8px;border:2px solid var(--line);background:var(--die);color:var(--pip);font:inherit;border-radius:12px;padding:10px;resize:vertical}
#fichas textarea:focus-visible{outline:3px solid var(--mut);outline-offset:3px}
.fh{font-size:.85rem;color:var(--mut);margin:8px 0;text-align:center}
.card{border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--chip);color:var(--ink);overflow-wrap:anywhere}
.card .pre{white-space:pre-wrap;margin-top:6px}
#finbox{width:100%;max-width:520px}
#finbox h3{margin:6px 0 0;font-size:1rem}
</style>
</head>
<body>
<section id="lobby">
<input id="nick" maxlength="20" placeholder="Seu nome" aria-label="Seu nome">
<input id="code" maxlength="30" placeholder="Código da sala" aria-label="Código da sala" autocapitalize="none" autocomplete="off">
<button id="enter">Entrar na sala</button>
<button class="sec" id="gen">Gerar código</button>
</section>
<div id="status" role="status"></div>
<div id="peers"></div>
<button class="chip" id="copy" style="display:none">Copiar convite</button>
<div id="sides" role="group" aria-label="Tipo de dado"></div>
<div id="cust"><input id="cin" type="number" inputmode="numeric" min="2" max="1000000" placeholder="Ex.: 1000" aria-label="Número de lados"><button class="chip" id="cok" style="background:var(--btn);color:var(--btnt)">Usar</button></div>
<div id="who"></div>
<div id="total">&nbsp;</div>
<div id="tray" aria-live="polite"></div>
<div class="bar"><button class="step" id="minus" aria-label="Menos dados">−</button><span id="n">1</span><button class="step" id="plus" aria-label="Mais dados">+</button></div>
<div class="bar mod"><span>Modificador</span><button class="step" id="mminus" aria-label="Diminuir modificador">−</button><input id="min" type="number" inputmode="numeric" value="0" aria-label="Modificador"><button class="step" id="mplus" aria-label="Aumentar modificador">+</button></div>
<details id="npcs"><summary>NPCs (para o mestre)</summary>
<div class="npcrow"><input id="npcn" maxlength="20" placeholder="Novo NPC, ex.: Goblin 1" aria-label="Nome do NPC"><button class="chip" id="npcb" style="background:var(--btn);color:var(--btnt)">Adicionar</button></div>
<div class="npcrow"><label for="as">Rolar como</label><select id="as"></select><button class="chip" id="npcx">Remover</button></div>
</details>
<button id="roll">Rolar</button>
<details id="fichas"><summary>Fichas</summary>
<div class="npcrow"><select id="fsel" aria-label="Escolher ficha"></select><button class="chip" id="fnew">Nova ficha</button><button class="chip" id="fdel">Excluir</button></div>
<div class="npcrow"><button class="chip" id="fimp">Importar arquivo</button><button class="chip" id="fexp">Exportar ficha</button><input type="file" id="ffile" accept=".json,.txt,application/json,text/plain" hidden></div>
<div id="fform" style="display:none">
<div class="npcrow"><input id="f_name" class="fi" maxlength="40" placeholder="Nome do personagem" aria-label="Nome do personagem"><input id="f_cls" class="fi" maxlength="40" placeholder="Classe / raça" aria-label="Classe ou raça"></div>
<div class="npcrow"><input id="f_lvl" class="fi sm" maxlength="10" placeholder="Nível" aria-label="Nível"><input id="f_hp" class="fi sm" maxlength="10" placeholder="PV atual" aria-label="PV atual"><input id="f_hpm" class="fi sm" maxlength="10" placeholder="PV máx." aria-label="PV máximo"></div>
<div id="f_attrs" class="attrs"></div>
<textarea id="f_notes" maxlength="1500" placeholder="Anotações, perícias, magias…" aria-label="Anotações"></textarea>
<textarea id="f_inv" maxlength="1500" placeholder="Inventário" aria-label="Inventário"></textarea>
<p class="fh">Esta ficha fica só neste aparelho. Ninguém na sala vê, a não ser que você compartilhe.</p>
<div class="npcrow"><label for="fto">Compartilhar com</label><select id="fto"></select></div>
<div class="npcrow"><label for="fdur">por</label><select id="fdur"><option value="5">5 minutos</option><option value="30">30 minutos</option><option value="60">1 hora</option><option value="180">3 horas</option></select><button class="chip" id="fshare" style="background:var(--btn);color:var(--btnt)">Compartilhar</button></div>
</div>
<p class="fh" id="fmy"></p>
<div id="fshares"></div>
</details>
<section id="finbox"></section>
<details id="music"><summary>Música da sala</summary>
<div class="npcrow"><input id="murl" placeholder="Link do YouTube, Spotify ou .mp3" aria-label="Link da música" autocapitalize="none" autocomplete="off"></div>
<div class="npcrow"><button class="chip" id="mgo" style="background:var(--btn);color:var(--btnt)">Tocar para todos</button><button class="chip" id="mstop">Parar</button></div>
</details>
<section id="mplayer"></section>
<section id="feedwrap"><div class="hrow"><h2>Histórico da sala</h2><button class="chip" id="hclear">Limpar histórico</button></div><ul id="list"></ul></section>
<script>
var P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
var TYPES=[4,6,8,10,12,20,100];
var sides=6,count=1,custom=false,mod=0,busy=false,cool=false;
var topic='',es=null,joined=false,nick='',feed=[],seen={},mine={},players={},joinMs=0,q=[];
function $(i){return document.getElementById(i)}
var tray=$('tray'),total=$('total'),who=$('who'),sidesEl=$('sides');
function note(t){$('status').textContent=t||''}
function rndN(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1}
function strip(s){return String(s==null?'':s).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g,'')}
function face(el,v,sd){
el.innerHTML='';el.setAttribute('aria-label','Dado: '+v);
if(sd===6){for(var i=0;i<9;i++){if(P[v].indexOf(i)>-1){var p=document.createElement('div');p.className='pip';p.style.gridArea=(Math.floor(i/3)+1)+'/'+(i%3+1);el.appendChild(p)}}}
else{var L=String(v).length;el.textContent=v;el.style.fontSize='calc(var(--s)*'+(L>=7?.16:L>=6?.19:L>=5?.22:L>=4?.28:L>=3?.34:.42)+')'}}
function mk(v,sd){var d=document.createElement('div');var c='die';if(sd!==6){c+=' x '+(TYPES.indexOf(sd)>-1?'s'+sd:'sc')}d.className=c;face(d,v,sd);return d}
function draw(vals,sd){tray.innerHTML='';var n=vals.length;tray.style.setProperty('--s',(n>6?68:n>4?82:n>2?100:n===2?124:150)+'px');vals.forEach(function(v){tray.appendChild(mk(v,sd))})}
function preview(){if(busy)return;var v=[];for(var i=0;i<count;i++)v.push(rndN(sides));draw(v,sides);total.innerHTML='&nbsp;';who.textContent=''}
function line(e){var hm=e.m||0,sg=hm>0?' + ':' − ';return e.n+(e.p?' (NPC)':'')+' — '+e.c+'d'+e.s+(hm?(hm>0?'+':'−')+Math.abs(hm):'')+': '+e.v.join(' + ')+(hm?sg+Math.abs(hm):'')+((e.c>1||hm)?' = '+(e.sum+hm):'')}
function renderFeed(){
var ul=$('list');ul.innerHTML='';
if(!feed.length){var l=document.createElement('li');l.id='empty';l.textContent='Nenhuma rolagem ainda.';ul.appendChild(l)}
feed.forEach(function(e){var li=document.createElement('li');var r=document.createElement('span');r.className='r';r.textContent=e.sys?'Histórico apagado por '+e.n:line(e);
var t=document.createElement('span');t.className='t';t.textContent=new Date(e.t).toLocaleTimeString('pt-BR');li.appendChild(r);li.appendChild(t);ul.appendChild(li)})}
function addFeed(e){feed.unshift(e);if(feed.length>100)feed.length=100;renderFeed()}
function enqueue(e){q.push(e);if(!busy)next()}
function next(){
if(!q.length){busy=false;return}
busy=true;var e=q.shift();
var ph=[];for(var i=0;i<e.c;i++)ph.push(1);draw(ph,e.s);
var els=tray.children;for(var j=0;j<els.length;j++)els[j].classList.add('go');
who.textContent=e.n+(e.p?' (NPC)':'')+' está rolando…';total.innerHTML='&nbsp;';
var t=setInterval(function(){for(var k=0;k<els.length;k++)face(els[k],rndN(e.s),e.s)},80);
setTimeout(function(){clearInterval(t);draw(e.v,e.s);total.textContent=(e.c>1||e.m)?String(e.sum+e.m):'';who.textContent=e.n+(e.p?' (NPC)':'')+' rolou';if(e.t>=clearT)addFeed(e);next()},700)}
function clean(d){
if(!d||typeof d!=='object')return null;
var s=Math.floor(+d.s),c=Math.floor(+d.c),m=Math.floor(+d.m)||0;
if(!(s>=2&&s<=1000000&&c>=1&&c<=9&&Array.isArray(d.v)&&d.v.length===c))return null;
var v=[],sum=0;for(var i=0;i<c;i++){var x=Math.floor(+d.v[i]);if(!(x>=1&&x<=s))return null;v.push(x);sum+=x}
if(Math.abs(m)>1000000)m=0;
return{id:strip(d.id).slice(0,24),n:strip(d.n).slice(0,20)||'Alguém',p:d.p?1:0,c:c,s:s,v:v,m:m,sum:sum,t:Math.floor(+d.t)||Date.now()}}
var BASE='https://ntfy.sh/';
function post(obj){return fetch(BASE+topic,{method:'POST',body:JSON.stringify(obj)}).then(function(r){if(!r.ok)throw new Error('http '+r.status)})}
function roll(){
if(cool)return;cool=true;setTimeout(function(){cool=false},900);
var v=[],s=0;for(var i=0;i<count;i++){var x=rndN(sides);v.push(x);s+=x}
var sel=$('as').value,isN=sel!==''&&npcs[+sel]!==undefined;
var e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),n:isN?npcs[+sel]:(nick||'Eu'),p:isN?1:0,c:count,s:sides,v:v,m:mod,sum:s,t:Date.now()};
if(joined){mine[e.id]=1;post({k:'roll',id:e.id,n:e.n,p:e.p,c:e.c,s:e.s,v:e.v,m:e.m,t:e.t}).catch(function(){note('Não consegui enviar para a sala. Mostrando só para você.');seen[e.id]=1;enqueue(e)})}
else{seen[e.id]=1;enqueue(e)}}
function renderPlayers(){
var now=Date.now(),list=Object.keys(players).filter(function(n){return now-players[n]<3*3600*1000}).sort(function(a,b){return players[b]-players[a]});
$('peers').textContent=list.length?'Jogadores desta sala: '+list.map(function(n){return n===nick?n+' (você)':n}).join(', '):''}
function onMsg(ev){
var m;try{m=JSON.parse(ev.data)}catch(e){return}
if(!m||m.event!=='message')return;
var d;try{d=JSON.parse(m.message)}catch(e){return}
if(!d||typeof d!=='object')return;
var tms=(+m.time||0)*1000;
if(d.k==='hi'){var pn=strip(d.n).slice(0,20);if(pn){players[pn]=Math.max(players[pn]||0,tms);renderPlayers();if(typeof d.pk==='string')regKey(pn,d.pk,tms)}return}
if(d.k==='sheet'){onSheet(d);return}
if(d.k==='revoke'){onRevoke(d);return}
if(d.k==='music'){var mid=strip(d.id).slice(0,24);if(!mid||musicSeen[mid])return;musicSeen[mid]=1;
if(tms&&tms<musicT)return;if(tms)musicT=tms;
setMusic(strip(d.u).slice(0,300),strip(d.n).slice(0,20),!!(mine[mid]||tms>=joinMs-5000));return}
if(d.k==='clear'){var cid=strip(d.id).slice(0,24);if(!cid||seen[cid])return;seen[cid]=1;
if(tms>clearT)clearT=tms;
q=q.filter(function(x){return x.t>=clearT});
feed=[{sys:1,n:strip(d.n).slice(0,20)||'Alguém',t:tms||Date.now(),id:cid}];renderFeed();return}
if(d.k!=='roll')return;
var e=clean(d);if(!e||!e.id||seen[e.id])return;
seen[e.id]=1;if(tms)e.t=tms;
if(tms&&tms<clearT)return;
if(!e.p){players[e.n]=Math.max(players[e.n]||0,tms);renderPlayers()}
if(mine[e.id]||tms>=joinMs-5000){enqueue(e)}
else{feed.push(e);feed.sort(function(a,b){return b.t-a.t});if(feed.length>100)feed.length=100;renderFeed()}}
function enter(){
nick=strip($('nick').value).trim().slice(0,20)||'Jogador';
try{localStorage.setItem('dado-nick',nick)}catch(e){}
var code=strip($('code').value).trim().toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,40);
if(code.length<5){note('Digite um código de sala com pelo menos 5 letras ou números, ou toque em Gerar código.');return}
topic='dado-'+code;joinMs=Date.now();renderAs();
try{es=new EventSource(BASE+topic+'/sse?since=3h')}catch(e){note('Seu navegador não conseguiu abrir a sala.');return}
es.onopen=function(){note('Conectado à sala '+code+'. Toque em Copiar convite e mande para seus amigos.')};
es.onerror=function(){note('Reconectando à sala…')};
es.onmessage=onMsg;
joined=true;
$('lobby').style.display='none';$('copy').style.display='inline-block';
try{location.hash=code}catch(e){}
note('Entrando na sala '+code+'…');
keyReady.then(function(){var hf=function(){post({k:'hi',n:nick,pk:me.pub}).catch(function(){})};hf();clearInterval(hiT);hiT=setInterval(hf,20*60000)})}
function build(){
sidesEl.innerHTML='';
TYPES.forEach(function(s){var b=document.createElement('button');b.className='chip';b.textContent='d'+s;b.setAttribute('aria-pressed',!custom&&s===sides);
b.onclick=function(){if(busy)return;$('cust').classList.remove('on');sides=s;custom=false;build();preview()};sidesEl.appendChild(b)});
var o=document.createElement('button');o.className='chip';o.textContent=custom?'d'+sides:'Outro';o.setAttribute('aria-pressed',custom);
o.onclick=function(){$('cust').classList.toggle('on');$('cin').focus()};sidesEl.appendChild(o)}
function useCustom(){var v=parseInt($('cin').value,10);if(!v||v<2||busy)return;if(v>1000000)v=1000000;$('cust').classList.remove('on');sides=v;custom=true;build();preview()}
var min=$('min');
function setMod(v){v=parseInt(v,10);if(isNaN(v))v=0;mod=Math.max(-1000000,Math.min(1000000,v));min.value=mod}
min.oninput=function(){if(min.value===''||min.value==='-')return;setMod(min.value)};
min.onchange=function(){setMod(min.value)};
$('mplus').onclick=function(){setMod(mod+1)};
$('mminus').onclick=function(){setMod(mod-1)};
$('plus').onclick=function(){if(count>=9)return;count++;$('n').textContent=count;preview()};
$('minus').onclick=function(){if(count<=1)return;count--;$('n').textContent=count;preview()};
$('cok').onclick=useCustom;
$('cin').onkeydown=function(e){if(e.key==='Enter')useCustom()};
$('roll').onclick=roll;tray.onclick=roll;
$('enter').onclick=enter;
$('gen').onclick=function(){var c='',a='abcdefghjkmnpqrstuvwxyz23456789';for(var i=0;i<8;i++)c+=a[rndN(a.length)-1];$('code').value=c};
$('copy').onclick=function(){var u=location.href;try{navigator.clipboard.writeText(u).then(function(){note('Convite copiado. Mande para seus amigos.')},function(){note(u)})}catch(e){note(u)}};

function parseMusic(u){
var x;try{x=new URL(u)}catch(e){return null}
if(x.protocol!=='https:')return null;
var h=x.hostname.replace(/^www\./,'').replace(/^m\./,''),m,r=null;
if(h==='youtu.be'){m=x.pathname.match(/^\/([A-Za-z0-9_-]{11})$/);if(m)r={t:'yt',id:m[1],list:''}}
else if(h==='youtube.com'||h==='music.youtube.com'){
var v=x.searchParams.get('v'),l=x.searchParams.get('list'),okL=l&&/^[A-Za-z0-9_-]{10,50}$/.test(l);
if(v&&/^[A-Za-z0-9_-]{11}$/.test(v))r={t:'yt',id:v,list:okL?l:''};
else{m=x.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/);if(m)r={t:'yt',id:m[1],list:''};else if(okL)r={t:'ytl',list:l}}}
else if(h==='open.spotify.com'){m=x.pathname.match(/^\/(?:intl-[a-z]{2}\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]{10,30})/);if(m)r={t:'sp',k:m[1],id:m[2]}}
if(!r)r=/\.(mp3|ogg|wav|m4a|aac|opus)$/i.test(x.pathname)?{t:'au'}:{t:'ln'};
r.href=x.href;return r}

var me={priv:null,pub:'',fp:''},keys={},sheets=[],shares=[],inbox={},revoked={},cur='',hiT=null;
var FPN=['FOR','DES','CON','INT','SAB','CAR'];
function stripT(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g,'')}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function b64(u){var t='';for(var i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t)}
function unb64(t){var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function mins(exp){return Math.max(1,Math.ceil((exp-Date.now())/60000))}
async function fpOf(pub){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',unb64(pub)));var x='';for(var i=0;i<4;i++)x+=('0'+h[i].toString(16)).slice(-2);return x}
function fpFmt(f){return f.slice(0,4)+'-'+f.slice(4)}
async function initKey(){
var P256={name:'ECDH',namedCurve:'P-256'};
try{var sv=JSON.parse(localStorage.getItem('dado-key')||'null');if(sv&&sv.priv&&sv.pub){me.priv=await crypto.subtle.importKey('jwk',sv.priv,P256,false,['deriveKey']);me.pub=sv.pub}}catch(e){me.priv=null}
if(!me.priv){var kp=await crypto.subtle.generateKey(P256,true,['deriveKey']);var jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);me.pub=b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)));me.priv=kp.privateKey;try{localStorage.setItem('dado-key',JSON.stringify({priv:jwk,pub:me.pub}))}catch(e){}}
me.fp=await fpOf(me.pub);
$('fmy').textContent='Seu código de verificação: '+fpFmt(me.fp)+'. Antes de compartilhar, confira com a pessoa se o código dela bate.'}
var keyReady=(window.crypto&&crypto.subtle)?initKey().catch(function(){}):Promise.resolve();
async function aesFor(pub){var pk=await crypto.subtle.importKey('raw',unb64(pub),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},me.priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(pub,data){var key=await aesFor(pub),iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,data));return{iv:b64(iv),ct:b64(ct)}}
async function openB(spk,iv,ct){var key=await aesFor(spk);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct)))}
async function gz(str){var cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function ungz(buf){var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(buf);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
function cleanSheet(x){x=x||{};var at=Array.isArray(x.attrs)?x.attrs:[],a=[];
for(var i=0;i<6;i++){var y=at[i]||{};a.push({l:strip(y.l!=null?y.l:FPN[i]).slice(0,8),v:strip(y.v).slice(0,8)})}
return{id:strip(x.id).slice(0,24),name:strip(x.name).slice(0,40),cls:strip(x.cls).slice(0,40),lvl:strip(x.lvl).slice(0,10),hp:strip(x.hp).slice(0,10),hpm:strip(x.hpm).slice(0,10),attrs:a,notes:stripT(x.notes).slice(0,1500),inv:stripT(x.inv).slice(0,1500)}}

async function onSheet(d){
try{await keyReady;var id=strip(d.id).slice(0,24);
if(!me.fp||d.to!==me.fp||!id||revoked[id]||inbox[id]||typeof d.spk!=='string')return;
var buf=await openB(d.spk,d.iv,d.ct);
var o=JSON.parse(d.z?await ungz(buf):new TextDecoder().decode(buf));
if(!o||o.sid!==id||!(+o.exp>Date.now())||revoked[id])return;
inbox[id]={sid:id,from:strip(d.n).slice(0,20)||'Alguém',fp:await fpOf(d.spk),exp:Math.min(+o.exp,Date.now()+4*3600000),s:cleanSheet(o.s)};
renderInbox()}catch(e){}}

try{await keyReady;var id=strip(d.id).slice(0,24);
if(!me.fp||d.to!==me.fp||!id||typeof d.spk!=='string')return;
var t=new TextDecoder().decode(await openB(d.spk,d.iv,d.ct));

async function shareSheet(sh,toFp,min){
await keyReady;
if(!me.priv){note('Este navegador não suporta o compartilhamento seguro de fichas.');return}
if(!joined){note('Entre numa sala para compartilhar.');return}
var peer=keys[toFp];if(!peer){note('Pessoa não encontrada. Ela precisa estar na sala.');return}
var sid=rid(),exp=Date.now()+min*60000;
var plain=JSON.stringify({sid:sid,exp:exp,s:{name:sh.name,cls:sh.cls,lvl:sh.lvl,hp:sh.hp,hpm:sh.hpm,attrs:sh.attrs,notes:sh.notes,inv:sh.inv}});
var data=new TextEncoder().encode(plain),z=0;
if(typeof CompressionStream!=='undefined'){try{data=await gz(plain);z=1}catch(e){data=new TextEncoder().encode(plain);z=0}}
var sl=await seal(peer.pk,data);
var msg={k:'sheet',id:sid,to:toFp,spk:me.pub,n:nick||'Eu',z:z,iv:sl.iv,ct:sl.ct};
if(JSON.stringify(msg).length>3900){note('Ficha grande demais para compartilhar. Encurte as anotações ou o inventário.');return}
try{await post(msg)}catch(e){note('Não consegui compartilhar. Tente de novo.');return}
shares.push({sid:sid,toFp:toFp,toName:peer.n,pk:peer.pk,exp:exp,name:sh.name});renderShares();
note('Ficha compartilhada com '+peer.n+' por '+min+' minutos.')}

function pick(o,ks){for(var i=0;i<ks.length;i++){if(o[ks[i]]!=null)return o[ks[i]]}return ''}

if(Array.isArray(ra)){at=ra.slice(0,6).map(function(a){return a&&typeof a==='object'?{l:a.l!=null?a.l:a.nome,v:a.v!=null?a.v:a.valor}:{l:null,v:a}})}
else if(ra&&typeof ra==='object'){at=Object.keys(ra).slice(0,6).map(function(k){return{l:k,v:ra[k]}})}
return cleanSheet({id:rid(),name:pick(o,['name','nome'])||fb||'Ficha importada',cls:pick(o,['cls','classe']),lvl:pick(o,['lvl','nivel','nível','level']),hp:pick(o,['hp','pv']),hpm:pick(o,['hpm','pvmax','pv_max','hpmax']),attrs:at,notes:pick(o,['notes','notas','anotacoes','anotações']),inv:pick(o,['inv','inventario','inventário'])})}

$('ffile').onchange=function(){
var f=this.files&&this.files[0],inp=this;if(!f)return;

var r=new FileReader();

var txt=String(r.result||''),list=[],base=strip(f.name.replace(/\.[^.]+$/,'')).slice(0,40),isTxt=false;

else{isTxt=true;list.push(cleanSheet({id:rid(),name:base||'Ficha importada',notes:txt}))}
}catch(e){note('Não consegui ler esse arquivo. Use o modelo em JSON ou um arquivo .txt.');inp.value='';return}

inp.value=''};
r.onerror=function(){note('Não consegui abrir o arquivo.')};
r.readAsText(f)};
